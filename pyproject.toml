[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "freeboard"
version = "0.2.0"
description = "Measure how much safety envelope an AI agent deployment has left, without ever seeing its data."
readme = "README-pypi.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Kaustubh Patil" }]
keywords = [
    "ai-agents", "observability", "risk", "actuarial", "credibility",
    "insurance", "audit", "compliance", "eu-ai-act", "opentelemetry", "privacy",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: System :: Monitoring",
    "Typing :: Typed",
]
# The SDK is stdlib only, on purpose: it drops into a customer's process and
# should add nothing to their dependency review.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.urls]
Homepage = "https://github.com/kaustubhspatil/agent-credibility"
Repository = "https://github.com/kaustubhspatil/agent-credibility"
Documentation = "https://github.com/kaustubhspatil/agent-credibility/blob/main/docs/EVALUATING.md"

# Only the SDK is published. The research package in this repo needs numpy and
# pandas, and shipping it inside a zero-dependency distribution would be a lie;
# it is reproduced from a clone, see requirements-research.txt.
[tool.setuptools.packages.find]
where = ["src"]
include = ["freeboard*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
