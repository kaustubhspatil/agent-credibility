[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-credibility"
version = "0.1.0"
description = "Bühlmann credibility for AI agent deployments: does a pooled prior earn its keep?"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "pandas>=2.1", "pyarrow>=14"]

[project.optional-dependencies]
data = ["datasets>=3", "huggingface_hub>=0.24"]
plots = ["matplotlib>=3.8"]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
